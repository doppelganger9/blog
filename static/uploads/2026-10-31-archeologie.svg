<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif" role="img" aria-labelledby="t d">
<title id="t">Chronologie de la couverture de code de ce blog</title>
<desc id="d">Juillet 2020 : couverture et badge Coveralls. Octobre 2022 : commit « Disable failing coveralls ... ». 2022 : bandeau « code coverage is currently broken ». Janvier 2023 : migration Cypress 12, le plugin de couverture est oublié. 31 octobre 2026, 17 h 17 : couverture réparée. 31 octobre 2026, soir : migration vers Playwright.</desc>
<rect width="800" height="300" rx="12" fill="#fcfcfb"/>
<text x="24" y="38" font-size="22" font-weight="700" fill="#1f1f1e">Six ans de couverture de code, en un coup d'œil</text>
<line x1="40" y1="160" x2="760" y2="160" stroke="#c3c2b7" stroke-width="2"/>
<rect x="232" y="152" width="398" height="16" rx="8" fill="#eb6834" opacity="0.18"/>
<text x="431" y="190" font-size="12" font-style="italic" fill="#a8461c" text-anchor="middle">quatre ans de déni</text>
<g font-size="13" fill="#1f1f1e">
  <circle cx="70" cy="160" r="8" fill="#1baf7a"/>
  <line x1="70" y1="152" x2="70" y2="96" stroke="#c3c2b7"/>
  <text x="70" y="70" text-anchor="middle" font-weight="700">juil. 2020</text>
  <text x="70" y="88" text-anchor="middle">couverture + badge</text>

  <circle cx="232" cy="160" r="8" fill="#eb6834"/>
  <line x1="232" y1="168" x2="232" y2="214" stroke="#c3c2b7"/>
  <text x="232" y="232" text-anchor="middle" font-weight="700">10 oct. 2022</text>
  <text x="232" y="250" text-anchor="middle">« Disable failing</text>
  <text x="232" y="266" text-anchor="middle">coveralls ... »</text>

  <circle cx="330" cy="160" r="8" fill="#eb6834"/>
  <line x1="330" y1="152" x2="330" y2="96" stroke="#c3c2b7"/>
  <text x="330" y="70" text-anchor="middle" font-weight="700">2022</text>
  <text x="330" y="88" text-anchor="middle">bandeau « broken »</text>

  <circle cx="430" cy="160" r="8" fill="#eb6834"/>
  <line x1="430" y1="168" x2="430" y2="214" stroke="#c3c2b7"/>
  <text x="430" y="232" text-anchor="middle" font-weight="700">janv. 2023</text>
  <text x="430" y="250" text-anchor="middle">Cypress 12 oublie</text>
  <text x="430" y="266" text-anchor="middle">le plugin</text>

  <circle cx="630" cy="160" r="8" fill="#2a78d6"/>
  <line x1="630" y1="152" x2="630" y2="96" stroke="#c3c2b7"/>
  <text x="630" y="70" text-anchor="middle" font-weight="700">31 oct. 2026, 17 h</text>
  <text x="630" y="88" text-anchor="middle">couverture réparée</text>

  <circle cx="730" cy="160" r="8" fill="#2a78d6"/>
  <line x1="730" y1="168" x2="730" y2="214" stroke="#c3c2b7"/>
  <text x="730" y="232" text-anchor="middle" font-weight="700">31 oct., soir</text>
  <text x="730" y="250" text-anchor="middle">Playwright :</text>
  <text x="730" y="266" text-anchor="middle">« go »</text>
</g>
</svg>
