name: SvelteKit Blog CI

on: [push]

# Cette section gère la limitation des builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: npm install
      run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: build
      run: npm run build
    - name: E2E tests with code coverage
      # V8 coverage of the production build, mapped to src/ with the sourcemaps
      run: npm run test:coverage
      env:
        CI: true
    - name: Upload Playwright report
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: playwright-report/
        if-no-files-found: ignore
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage/lcov.info
        # a Coveralls outage must not turn the build red (that is how it got disabled in 2022)
        fail-on-error: false

  # Visual regression tests (e2e/visual.spec.ts). Font rendering differs from one machine to another,
  # so the screenshots are taken, and the reference images generated, in the official Playwright
  # image, pinned to the version of @playwright/test (Renovate updates both in the same branch).
  # A commit whose message contains [update-screenshots] regenerates the reference images and
  # commits them to the branch instead of comparing.
  visual:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    permissions:
      contents: write
    env:
      UPDATE: ${{ contains(github.event.head_commit.message, '[update-screenshots]') }}
    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: npm install
      run: npm ci
    - name: build
      run: npm run build
    - name: Visual regression tests
      if: env.UPDATE != 'true'
      run: npx playwright test --project='visual-*'
      env:
        CI: true
        VISUAL: true
    - name: Upload the screenshots that differ
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: visual-diffs
        path: test-results/
        if-no-files-found: ignore
    - name: Update the reference screenshots
      if: env.UPDATE == 'true'
      run: |
        VISUAL=true npx playwright test --project='visual-*' --update-snapshots
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git add e2e/__screenshots__
        git commit -m 'Update the reference screenshots' || exit 0
        git push origin "HEAD:$GITHUB_REF_NAME"
