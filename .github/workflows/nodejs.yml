name: SvelteKit Blog CI

on: [push]

# Cette section gère la limitation des builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
    - name: npm install, build, and test
      # the production build is checked first, then the tests run against an
      # instrumented build (CYPRESS_COVERAGE=true) to measure the code coverage
      run: |
        npm ci
        npm run build --if-present
        npm run test:coverage
      env:
        CI: true
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage/lcov.info
        # a Coveralls outage must not turn the build red (that is how it got disabled in 2022)
        fail-on-error: false
