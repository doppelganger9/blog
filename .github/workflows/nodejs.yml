name: SvelteKit Blog CI

on: [push]

# Cette section gère la limitation des builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
    - name: npm install
      run: npm ci
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: build
      run: npm run build
    - name: E2E tests with code coverage
      # V8 coverage of the production build, mapped to src/ with the sourcemaps
      run: npm run test:coverage
      env:
        CI: true
    - name: Upload Playwright report
      if: ${{ failure() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: playwright-report/
        if-no-files-found: ignore
    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage/lcov.info
        # a Coveralls outage must not turn the build red (that is how it got disabled in 2022)
        fail-on-error: false
